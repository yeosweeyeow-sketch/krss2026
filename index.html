<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invigilation Schedule Calendar</title>
    <!-- Tailwind CSS Engine for Responsive UI components -->
    <script src="https://jsdelivr.net"></script>
    <!-- Alpine.js Core for Frontend Client States -->
    <script defer src="https://jsdelivr.net"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen">

    <div x-data="calendarApp()" x-init="initCalendar()" class="max-w-7xl mx-auto p-4 md:p-6">
        
        <!-- App Title Banner -->
        <header class="flex flex-col md:flex-row md:items-center md:justify-between border-b border-gray-200 pb-4 mb-6">
            <div>
                <h1 class="text-2xl font-bold text-gray-900">Exam Invigilation Schedule</h1>
                <p class="text-sm text-gray-500">October 2026 – November 2026</p>
            </div>
            <div class="mt-4 md:mt-0 flex gap-2">
                <button @click="openAddModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium shadow-xs transition">
                    + Add Assignment
                </button>
            </div>
        </header>

        <!-- Filters Section -->
        <div class="bg-white p-4 rounded-xl shadow-xs border border-gray-100 mb-6 flex flex-wrap gap-4 items-end">
            <div class="w-full sm:w-auto">
                <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Filter by Invigilator</label>
                <select x-model="filters.invigilator" class="w-full sm:w-48 bg-gray-50 border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                    <option value="">All Invigilators</option>
                    <template x-for="name in getUniqueInvigilators()" :key="name">
                        <option :value="name" x-text="name"></option>
                    </template>
                </select>
            </div>
            
            <div class="w-full sm:w-auto">
                <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Filter by Date</label>
                <input type="date" x-model="filters.date" min="2026-10-01" max="2026-11-30" class="w-full sm:w-44 bg-gray-50 border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <button x-show="filters.invigilator || filters.date" @click="resetFilters()" class="text-sm text-red-600 hover:text-red-800 font-medium pb-2">
                Clear Filters
            </button>
        </div>

        <!-- Month Navigation Controls -->
        <div class="flex items-center justify-between mb-4">
            <h2 class="text-xl font-bold text-gray-800" x-text="currentMonthName + ' ' + currentYear"></h2>
            <div class="inline-flex rounded-md shadow-xs">
                <button @click="prevMonth()" :disabled="currentMonth === 9 && currentYear === 2026" class="px-4 py-2 text-sm font-medium bg-white border border-gray-300 rounded-l-lg hover:bg-gray-50 disabled:opacity-40 disabled:cursor-not-allowed">
                    Previous
                </button>
                <button @click="nextMonth()" :disabled="currentMonth === 10 && currentYear === 2026" class="px-4 py-2 text-sm font-medium bg-white border border-gray-300 rounded-r-lg hover:bg-gray-50 disabled:opacity-40 disabled:cursor-not-allowed">
                    Next
                </button>
            </div>
        </div>

        <!-- Calendar Month View Layout -->
        <div class="bg-white rounded-xl shadow-xs border border-gray-200 overflow-hidden">
            <!-- Grid Header Days -->
            <div class="grid grid-cols-7 border-b border-gray-200 bg-gray-50 text-center text-xs font-bold uppercase tracking-wider text-gray-500 py-3">
                <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
            </div>
            
            <!-- Structural Calendar Days Matrix Grid -->
            <div class="grid grid-cols-7 bg-gray-200 gap-[1px]">
                <template x-for="day in calendarDays" :key="day.id">
                    <div class="bg-white min-h-[140px] p-2 flex flex-col justify-between transition"
                         :class="{ 'bg-gray-50/50 opacity-40': !day.isCurrentMonth, 'bg-blue-50/30': day.isToday }">
                        
                        <!-- Header Numeric Indicators -->
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-sm font-semibold rounded-full w-6 h-6 flex items-center justify-center"
                                  :class="day.isToday ? 'bg-blue-600 text-white' : 'text-gray-700'" x-text="day.date"></span>
                        </div>

                        <!-- Data Cards Core Collection Container -->
                        <div class="space-y-1 flex-1 overflow-y-auto max-h-[105px] pr-1">
                            <template x-for="session in filterSessions(day.fullDate)" :key="session.id">
                                <div @click="openEditModal(session)" 
                                     class="text-[10px] p-1.5 rounded border border-blue-200 bg-blue-50 hover:bg-blue-100 text-blue-900 cursor-pointer shadow-2xs font-medium transition"
                                     :title="session.course + ' - ' + session.invigilator + ' (' + session.room + ')'">
                                    <div class="font-bold flex justify-between">
                                        <span x-text="session.time"></span>
                                        <span class="text-gray-500 text-[9px]" x-text="session.room"></span>
                                    </div>
                                    <div class="truncate text-gray-700"><span class="font-semibold text-blue-800" x-text="session.invigilator"></span></div>
                                    <div class="truncate text-[9px] text-blue-700" x-text="session.course"></div>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>
            </div>
        </div>

        <!-- Crud Workflow Operation Overlay Modal -->
        <div x-show="modal.open" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50" x-cloak>
            <div @click.away="modal.open = false" class="bg-white rounded-xl shadow-xl max-w-md w-full p-6 border border-gray-100">
                <h3 class="text-lg font-bold text-gray-900 mb-4" x-text="modal.isEdit ? 'Edit Assignment' : 'Add Assignment'"></h3>
                
                <form @submit.prevent="saveAssignment()" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Invigilator Name</label>
                        <input type="text" x-model="modal.data.invigilator" required class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Date</label>
                            <input type="date" x-model="modal.data.date" min="2026-10-01" max="2026-11-30" required class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Time</label>
                            <input type="text" x-model="modal.data.time" placeholder="e.g., 08:00 AM" required class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Course / Exam</label>
                            <input type="text" x-model="modal.data.course" placeholder="e.g., P2 COMPUTING" required class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Room</label>
                            <input type="text" x-model="modal.data.room" placeholder="e.g., R1 (COM Lab 1)" required class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                    </div>

                    <div class="flex justify-between items-center pt-4 border-t border-gray-100">
                        <div>
                            <button type="button" x-show="modal.isEdit" @click="deleteAssignment(modal.data.id)" class="text-sm bg-red-50 hover:bg-red-100 text-red-600 px-3 py-2 rounded-lg font-medium transition">
                                Delete
                            </button>
                        </div>
                        <div class="flex gap-2">
                            <button type="button" @click="modal.open = false" class="text-sm bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-lg font-medium transition">
                                Cancel
                            </button>
                            <button type="submit" class="text-sm bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-medium transition">

Save

modal: { open: false, isEdit: false, data: {} },
initCalendar() {
this.renderCalendar();
},
renderCalendar() {
const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
this.currentMonthName = monthNames[this.currentMonth];
const firstDayIndex = new Date(this.currentYear, this.currentMonth, 1).getDay();
const totalDays = new Date(this.currentYear, this.currentMonth + 1, 0).getDate();
const prevTotalDays = new Date(this.currentYear, this.currentMonth, 0).getDate();
let days = [];
// Previous month filler days
for (let i = firstDayIndex - 1; i >= 0; i--) {
let m = this.currentMonth - 1;
let y = this.currentYear;
if(m < 0) { m = 11; y--; }
days.push({
id: prev-${i},
date: prevTotalDays - i,
fullDate: ${y}-${String(m + 1).padStart(2, '0')}-${String(prevTotalDays - i).padStart(2, '0')},
isCurrentMonth: false
});
}
// Current month days
const todayStr = new Date().toISOString().split('T')[0];
for (let i = 1; i <= totalDays; i++) {
let fullDateStr = ${this.currentYear}-${String(this.currentMonth + 1).padStart(2, '0')}-${String(i).padStart(2, '0')};
days.push({
id: curr-${i},
date: i,
fullDate: fullDateStr,
isCurrentMonth: true,
isToday: fullDateStr === todayStr
});
}
// Next month filler days to complete grid alignment
let remainingCells = 42 - days.length;
if(remainingCells > 7) remainingCells -= 7;
for (let i = 1; i <= remainingCells; i++) {
let m = this.currentMonth + 1;
let y = this.currentYear;
if(m > 11) { m = 0; y++; }
days.push({
id: next-${i},
date: i,
fullDate: ${y}-${String(m + 1).padStart(2, '0')}-${String(i).padStart(2, '0')},
isCurrentMonth: false
});
}
this.calendarDays = days;
},
prevMonth() {
if (this.currentMonth === 9 && this.currentYear === 2026) return;
this.currentMonth--;
this.renderCalendar();
},
nextMonth() {
if (this.currentMonth === 10 && this.currentYear === 2026) return;
this.currentMonth++;
this.renderCalendar();
},
filterSessions(dateString) {
if (this.filters.date && this.filters.date !== dateString) return [];
return this.sessions.filter(session => {
if (session.date !== dateString) return false;
if (this.filters.invigilator && !session.invigilator.toLowerCase().includes(this.filters.invigilator.toLowerCase())) return false;
return true;
});
},
getUniqueInvigilators() {
return [...new Set(this.sessions.map(s => s.invigilator.trim()))].sort();
},
resetFilters() {
this.filters.invigilator = '';
this.filters.date = '';
},
openAddModal() {
this.modal.isEdit = false;
this.modal.data = { id: null, date: ${this.currentYear}-${String(this.currentMonth+1).padStart(2,'0')}-01, time: '08:00 AM', invigilator: '', course: '', room: '' };
this.modal.open = true;
},
openEditModal(session) {
this.modal.isEdit = true;
this.modal.data = { ...session };
this.modal.open = true;
},
saveAssignment() {
if (this.modal.isEdit) {
const idx = this.sessions.findIndex(s => s.id === this.modal.data.id);
if (idx !== -1) this.sessions[idx] = { ...this.modal.data };
} else {
this.modal.data.id = Date.now();
this.sessions.push({ ...this.modal.data });
}
this.modal.open = false;
},
deleteAssignment(id) {
this.sessions = this.sessions.filter(s => s.id !== id);
this.modal.open = false;
}
}
